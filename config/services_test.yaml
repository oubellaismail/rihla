# Test environment only: make the business services public so integration tests can fetch them
# from the container even before a controller or command injects them.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    App\Service\:
        resource: '../src/Service/'

    App\Repository\:
        resource: '../src/Repository/'

    App\Tests\Support\FakeGeoApis: ~

    # Rate limiter state kept in memory (not reset between requests of one test, gone between tests).
    app.test_rate_limiter_storage:
        class: Symfony\Component\RateLimiter\Storage\InMemoryStorage
